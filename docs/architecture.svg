<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">High-Availability LMS Container Architecture</title>
  <desc id="desc">Diagram showing clients hitting the Nginx reverse proxy, which distributes traffic to multiple Flask app containers backed by a load balancer and health checks.</desc>

  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #334155; }
      .label { font: 600 20px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #2563eb; stroke-width: 3; rx: 18; }
      .appbox { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.5; rx: 16; }
      .proxy { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2.5; rx: 16; }
      .client { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; rx: 16; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" class="title">High-Availability Containerized LMS Architecture</text>

  <rect x="90" y="140" width="170" height="110" class="client"/>
  <text x="175" y="185" text-anchor="middle" class="label">Client</text>
  <text x="175" y="212" text-anchor="middle" class="small">HTTP Requests</text>

  <rect x="420" y="115" width="370" height="190" class="proxy"/>
  <text x="605" y="155" text-anchor="middle" class="label">Nginx Reverse Proxy</text>
  <text x="605" y="185" text-anchor="middle" class="small">Round-robin load balancing</text>
  <text x="605" y="215" text-anchor="middle" class="small">Active health checks</text>
  <text x="605" y="245" text-anchor="middle" class="small">Retry and timeout handling</text>

  <rect x="350" y="410" width="190" height="130" class="appbox"/>
  <text x="445" y="455" text-anchor="middle" class="label">Flask App</text>
  <text x="445" y="485" text-anchor="middle" class="small">Replica 1</text>
  <text x="445" y="510" text-anchor="middle" class="small">/health + /api/courses</text>

  <rect x="610" y="410" width="190" height="130" class="appbox"/>
  <text x="705" y="455" text-anchor="middle" class="label">Flask App</text>
  <text x="705" y="485" text-anchor="middle" class="small">Replica 2</text>
  <text x="705" y="510" text-anchor="middle" class="small">/health + /api/courses</text>

  <line x1="260" y1="195" x2="420" y2="195" class="arrow"/>
  <line x1="605" y1="305" x2="445" y2="410" class="arrow dashed"/>
  <line x1="605" y1="305" x2="705" y2="410" class="arrow dashed"/>

  <line x1="445" y1="410" x2="445" y2="360" class="arrow dashed"/>
  <line x1="705" y1="410" x2="705" y2="360" class="arrow dashed"/>

  <text x="500" y="340" class="small">Health probe</text>
  <text x="742" y="340" class="small">Health probe</text>

  <rect x="278" y="560" width="660" height="90" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="14"/>
  <text x="608" y="595" text-anchor="middle" class="label">Docker Network: lms-network</text>
  <text x="608" y="620" text-anchor="middle" class="small">Secure internal communication between Nginx and app containers</text>
</svg>

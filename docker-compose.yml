version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - FLASK_ENV=production
      - PORT=5000
    networks:
      - lms-network

  nginx:
    image: nginx:alpine
    container_name: lms_reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge
